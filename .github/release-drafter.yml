categories:
  - title: '💥 Breaking Changes'
    when:
      label: 'breaking-change'
  - title: '🚀 Features'
    when:
      label: 'feature'
  - title: '🐛 Bug Fixes'
    when:
      label: 'fix'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'docs'
        - 'test'
  - title: '⬆️ Dependencies'
    collapse-after: 3
    when:
      labels:
        - 'dependencies'
  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "minor"
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      label: "patch"
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES

  ## Contributors

  Thanks to $CONTRIBUTORS for your contributions to this release!
autolabeler:
  - labels: ['chore', 'patch']
    files:
      - '*.md'
      - './github/*'
