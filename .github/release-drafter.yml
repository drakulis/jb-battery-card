categories:
  - title: '💥 Breaking Changes'
    when:
      label: 'breaking-change'
  - title: '🚀 Features'
    when:
      label: 'feature'
  - title: '🐛 Bug Fixes'
    when:
      label: 'fix'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'docs'
        - 'test'
  - title: '⬆️ Dependencies'
    collapse-after: 3
    when:
      labels:
        - 'dependencies'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
exclude-labels:
  - 'skip-changelog'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
template: |
  ## Changes

  $CHANGES

  ## Contributors

  Thanks to $CONTRIBUTORS for your contributions to this release!
autolabeler:
  - label: 'chore'
    files:
      - '*.md'
