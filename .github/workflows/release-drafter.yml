name: Release Drafter

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  drafter:
    name: 'Draft releases'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - jb-battery-card
    steps:
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter-${{ matrix.component }}.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
