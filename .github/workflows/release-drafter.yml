name: Release Drafter

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  drafter:
    name: 'Draft releases'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter-jb-battery-card.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
